<header>
    <button class="icon-circle btn-notes">
        <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>
    </button>
    <div class="logo">claudsmm</div>
    <button class="icon-circle btn-report">
        <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
    </button>
</header>

<main class="hero">
    <h2 id="welcome-text">مرحباً بك في claudsmm</h2>
    <p>وجهتك الأفضل لخدمات التسويق الرقمي المتميزة.</p>
    <img src="https://i.postimg.cc/1R2xdZPR/IMG-5513.png" alt="Marketing Services">
</main>

<div id="loader" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(255,255,255,0.8); z-index:9999; justify-content:center; align-items:center;">
    <div class="spinner">جاري التحميل...</div>
</div>

<div class="bottom-sheet" id="auth-sheet">
    <button class="sheet-btn btn-google" id="googleSignInBtn">
        <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
        المتابعة باستخدام حساب Google
    </button>
    <button class="sheet-btn btn-login">تسجيل الدخول</button>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyB98ZcMGXH5z20p7H9T-PXyM_29Xb0KN54",
        authDomain: "claudsmm-1bf0e.firebaseapp.com",
        projectId: "claudsmm-1bf0e",
        storageBucket: "claudsmm-1bf0e.firebasestorage.app",
        messagingSenderId: "1028854156095",
        appId: "1:1028854156095:web:a501ebb98679f82a40218a"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    // 1. مراقب حالة المستخدم (يمنع ظهور صفحة التسجيل إذا كان مسجلاً بالفعل)
    onAuthStateChanged(auth, (user) => {
        if (user) {
            window.location.href = "Dashboard/";
        } else {
            document.getElementById('auth-sheet').style.display = 'flex';
        }
    });

    document.getElementById('googleSignInBtn').addEventListener('click', async () => {
        const loader = document.getElementById('loader');
        loader.style.display = 'flex'; // إظهار التحميل

        try {
            // 2. تعيين استمرارية الجلسة (للبقاء مسجلاً حتى بعد إغلاق المتصفح)
            await setPersistence(auth, browserLocalPersistence);
            
            const result = await signInWithPopup(auth, provider);
            if (result.user) {
                window.location.href = "Dashboard/";
            }
        } catch (error) {
            console.error("Error:", error.code);
            loader.style.display = 'none';
            if (error.code !== 'auth/cancelled-popup-request') {
                alert("تعذر الاتصال، تأكد من إغلاق أي نافذة تسجيل سابقة.");
            }
        }
    });
</script>
